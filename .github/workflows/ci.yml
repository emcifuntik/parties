name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Windows (clang-cl + LLVM 22) ────────────────────────────────────────────
  windows:
    runs-on: windows-latest
    env:
      VCPKG_DOWNLOADS: ${{ github.workspace }}/.vcpkg-downloads
      VCPKG_BINARY_SOURCES: "clear;nuget,https://nuget.pkg.github.com/emcifuntik/index.json,readwrite"
    strategy:
      fail-fast: false
      matrix:
        preset: [default, release]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      # Source archives vcpkg downloads. A binary-cache miss (new runner image,
      # compiler or CMake) then rebuilds from these instead of fetching every
      # tarball from GitHub again, which fails whenever GitHub has a bad minute.
      - name: Locate vcpkg downloads
        id: vcpkg-downloads
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DOWNLOADS | Out-Null
          "rev=$(git -C vcpkg rev-parse HEAD)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Cache vcpkg downloads
        uses: actions/cache@v5
        with:
          path: ${{ env.VCPKG_DOWNLOADS }}
          key: vcpkg-downloads-${{ runner.os }}-${{ steps.vcpkg-downloads.outputs.rev }}-${{ hashFiles('vcpkg.json', 'vendor/ports/**') }}
          restore-keys: vcpkg-downloads-${{ runner.os }}-

      - name: Configure vcpkg NuGet binary caching
        shell: pwsh
        run: |
          &(vcpkg fetch nuget | Select-Object -Last 1) sources add `
            -Source "https://nuget.pkg.github.com/emcifuntik/index.json" `
            -StorePasswordInClearText -Name GitHubPackages `
            -UserName "emcifuntik" -Password "${{ secrets.GITHUB_TOKEN }}"
          &(vcpkg fetch nuget | Select-Object -Last 1) setapikey `
            "${{ secrets.GITHUB_TOKEN }}" `
            -Source "https://nuget.pkg.github.com/emcifuntik/index.json"

      - name: Install LLVM 22
        run: |
          choco install llvm --version=22.1.0 -y
          echo "LLVMInstallDir=C:\Program Files\LLVM" >> $env:GITHUB_ENV
          echo "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Install Ninja
        run: choco install ninja -y

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Upload client artifact
        if: matrix.preset == 'release'
        uses: actions/upload-artifact@v7
        with:
          name: parties-client-windows
          path: build-release/client/parties_client.exe

      - name: Upload server artifact
        if: matrix.preset == 'release'
        uses: actions/upload-artifact@v7
        with:
          name: parties-server-windows
          path: build-release/server/parties_server.exe

  # ── macOS (Apple Clang, ARM64) ──────────────────────────────────────────────
  macos:
    runs-on: macos-26
    env:
      VCPKG_DOWNLOADS: ${{ github.workspace }}/.vcpkg-downloads
    strategy:
      fail-fast: false
      matrix:
        preset: [macos-arm64-debug, macos-arm64-release]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      # Source archives vcpkg downloads. A binary-cache miss (new runner image,
      # compiler or CMake) then rebuilds from these instead of fetching every
      # tarball from GitHub again, which fails whenever GitHub has a bad minute.
      - name: Locate vcpkg downloads
        id: vcpkg-downloads
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DOWNLOADS | Out-Null
          "rev=$(git -C vcpkg rev-parse HEAD)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Cache vcpkg downloads
        uses: actions/cache@v5
        with:
          path: ${{ env.VCPKG_DOWNLOADS }}
          key: vcpkg-downloads-${{ runner.os }}-${{ steps.vcpkg-downloads.outputs.rev }}-${{ hashFiles('vcpkg.json', 'vendor/ports/**') }}
          restore-keys: vcpkg-downloads-${{ runner.os }}-

      - name: Cache vcpkg binary packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-macos-${{ matrix.preset }}-${{ hashFiles('vcpkg.json', 'vendor/ports/**') }}
          restore-keys: vcpkg-macos-${{ matrix.preset }}-

      - name: Install Ninja
        run: brew install ninja

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Upload client artifact
        if: matrix.preset == 'macos-arm64-release'
        uses: actions/upload-artifact@v7
        with:
          name: parties-client-macos
          path: build-macos-release/client/parties_client.app

  # ── Linux (server only, gcc) ────────────────────────────────────────────────
  linux:
    runs-on: ubuntu-24.04
    env:
      VCPKG_DOWNLOADS: ${{ github.workspace }}/.vcpkg-downloads
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      # Source archives vcpkg downloads. A binary-cache miss (new runner image,
      # compiler or CMake) then rebuilds from these instead of fetching every
      # tarball from GitHub again, which fails whenever GitHub has a bad minute.
      - name: Locate vcpkg downloads
        id: vcpkg-downloads
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DOWNLOADS | Out-Null
          "rev=$(git -C vcpkg rev-parse HEAD)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Cache vcpkg downloads
        uses: actions/cache@v5
        with:
          path: ${{ env.VCPKG_DOWNLOADS }}
          key: vcpkg-downloads-${{ runner.os }}-${{ steps.vcpkg-downloads.outputs.rev }}-${{ hashFiles('vcpkg.json', 'vendor/ports/**') }}
          restore-keys: vcpkg-downloads-${{ runner.os }}-

      - name: Cache vcpkg binary packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-linux-${{ hashFiles('vcpkg.json', 'vendor/ports/**') }}
          restore-keys: vcpkg-linux-

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            autoconf automake libtool

      - name: Configure
        run: cmake --preset linux-release -DCMAKE_MAKE_PROGRAM=/usr/bin/ninja

      - name: Build
        run: cmake --build --preset linux-release

      - name: Run integration tests
        run: |
          chmod +x build-linux/tests/parties_integration_test
          ./build-linux/tests/parties_integration_test

      - name: Upload server artifact
        uses: actions/upload-artifact@v7
        with:
          name: parties-server-linux
          path: build-linux/server/parties_server
