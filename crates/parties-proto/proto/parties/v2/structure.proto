// Area "Structure": channels, categories and overwrites
// (docs/rust-rewrite/03-protocol-v2.md sections 5.4 and 5.5,
// docs/rust-rewrite/05-permissions-and-roles.md section 2).
//
// An update names the revision of the channel it was based on. When another
// administrator changed the channel first, the response has the status
// CONFLICT and carries the current channel
// (docs/rust-rewrite/07-server-management.md section 5).

syntax = "proto3";

package parties.v2;

import "parties/v2/state.proto";

// ---------------------------------------------------------------------------
// Requests
// ---------------------------------------------------------------------------

// Creates a channel or a category, after its siblings. A channel created
// inside a category starts with a copy of the category's overwrites.
message CreateChannel {
  ChannelKind kind = 1;
  // The category to create the channel in; 0 for the top level.
  uint64 parent_id = 2;
  string name = 3;
  string topic = 4;
  uint32 user_limit = 5;
  LimitCaps limit_caps = 6;
  uint32 slow_mode_seconds = 7;
}

// Changes a channel. A field that is not set stays as it is.
message UpdateChannel {
  uint64 channel_id = 1;
  uint64 base_revision = 2;
  optional string name = 3;
  optional string topic = 4;
  // Moves the channel to another category, after its new siblings; 0 moves
  // it to the top level.
  optional uint64 parent_id = 5;
  optional uint32 user_limit = 6;
  // Replaces all of the channel's caps.
  LimitCaps limit_caps = 7;
  optional uint32 slow_mode_seconds = 8;
}

// Deletes a channel or a category.
message DeleteChannel {
  uint64 channel_id = 1;
}

// Reorders the channels of one parent, in one step.
message ReorderChannels {
  // The category whose channels are reordered; 0 for the top level.
  uint64 parent_id = 1;
  // Every channel of that parent, in the new order.
  repeated uint64 channel_ids = 2;
}

// Sets the overwrite of a channel for one target. Both masks are replaced.
message SetOverwrite {
  uint64 channel_id = 1;
  uint64 base_revision = 2;
  Overwrite overwrite = 3;
}

// Deletes the overwrite of a channel for one target.
message DeleteOverwrite {
  uint64 channel_id = 1;
  uint64 base_revision = 2;
  oneof target {
    uint64 role_id = 3;
    uint64 user_id = 4;
  }
}

// Replaces a channel's overwrites with a copy of its category's.
message SyncChannelPermissions {
  uint64 channel_id = 1;
  uint64 base_revision = 2;
}

// Result of the requests that create or change one channel: the channel as
// it is now. With the status CONFLICT it is the value the request lost
// against.
message ChannelResult {
  Channel channel = 1;
}

// ---------------------------------------------------------------------------
// Events
// ---------------------------------------------------------------------------

// A channel was created, or the receiver gained `ViewChannel` in it.
message ChannelCreated {
  Channel channel = 1;
}

// One or more channels changed in one step. A reorder and an edit of a
// category that synced channels follow change several.
message ChannelUpdated {
  repeated Channel channels = 1;
}

// A channel was deleted, or the receiver lost `ViewChannel` in it.
message ChannelDeleted {
  uint64 channel_id = 1;
}
